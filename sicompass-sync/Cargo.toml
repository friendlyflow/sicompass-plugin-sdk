# Its own workspace root: a library the plugins that sync with a cloud link.
[workspace]

[package]
name = "sicompass-sync"
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Cloud sync for sicompass plugins: the store's Merkle tree, a three-way merge, the sync protocol over the plugin's net, debouncing and the sync row"
repository = "https://github.com/friendlyflow/sicompass-plugin-sdk"
# Plugins take it by git from the SDK repo (cargo finds it by name), pinned
# to a rev or an SDK release tag. Not on crates.io (yet).
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Merkle hashes of a store, and the snapshot hash that lets an unchanged
# store upload nothing.
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
