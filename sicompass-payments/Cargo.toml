# Its own workspace root: a library, built for wasm32-wasip2 inside plugins and
# natively for its tests.
[workspace]

[package]
name = "sicompass-payments"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Cloud backup for sicompass plugins: store snapshots, the backup protocol over the plugin's net, debouncing and the backup row"
repository = "https://github.com/friendlyflow/sicompass-plugin-sdk"
# Plugins take it by git from the SDK repo (cargo finds it by name), pinned
# to a rev or an SDK release tag. Not on crates.io (yet).
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Hashes a store snapshot so an unchanged store uploads nothing.
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
