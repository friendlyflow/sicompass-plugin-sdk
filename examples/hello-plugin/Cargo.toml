# Its own workspace root: an example plugin, the program sicompass starts.
[workspace]

[package]
name = "hello-plugin"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "hello-plugin"
path = "src/main.rs"

[dependencies]
sicompass-sdk = { path = "../..", default-features = false, features = ["plugin"] }
