name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

# The cbindgen jobs that used to live here generated and attached a C header for
# `#[repr(C)]` plugins loaded with dlopen. That plugin type is gone — Apple forbids
# executing downloaded native code, and an in-process plugin could ignore every
# manifest policy — so there is no C ABI left to publish. Third-party plugins are
# WASM components; the contract is wit/sicompass-plugin.wit, which ships inside the
# crate and is checked by tests/wit_contract.rs.
jobs:
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the WIT contract holds
        run: cargo test --test wit_contract
      - name: Verify the guest half still builds for wasm
        run: |
          rustup target add wasm32-unknown-unknown wasm32-wasip2
          cargo check --no-default-features --target wasm32-unknown-unknown
          cargo check --no-default-features --target wasm32-wasip2
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
