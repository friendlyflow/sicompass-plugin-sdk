name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

# A plugin is a program that speaks the protocol in src/plugin_ipc, through the
# kit in src/plugin. Both ship in this crate, and the protocol's tests (message
# round trips, a real plugin process in tests/plugin_process.rs) guard them.
jobs:
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the protocol, the plugin kit and releases
        run: cargo test --all --features plugin,package
      - name: The plugin half builds without the app's dependencies
        run: cargo check --no-default-features --features plugin
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
