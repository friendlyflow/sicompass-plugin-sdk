# Its own workspace root, like sicompass-pdk and the examples: a host tool that
# the SDK's `cargo test` has no reason to build.
[workspace]

[package]
name = "sicompass-plugin"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Pack, sign and verify sicompass plugin releases"
repository = "https://github.com/friendlyflow/sicompass-plugin-sdk"
readme = "README.md"
keywords = ["sicompass", "plugin", "release"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# `cargo publish` strips the path and keeps the version.
sicompass-sdk = { version = "0.9.5", path = "../..", default-features = false, features = ["package"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
