# Its own workspace root on purpose: this crate only ever builds for a WASM
# target (wasm32-wasip2), and wit-bindgen's generated code uses
# `wasm_import_module` extern blocks that do not link on a host target. Keeping it
# out of the SDK's workspace means `cargo test` at the SDK root does not try.
[workspace]

[package]
name = "sicompass-pdk"
version = "0.6.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Sicompass plugin development kit — build sandboxed WASM providers in Rust"
repository = "https://github.com/friendlyflow/sicompass-plugin-sdk"
keywords = ["sicompass", "plugin", "wasm", "component", "wit"]
categories = ["api-bindings", "wasm"]
readme = "README.md"
# `wit` is a symlink to the canonical ../wit so there is one source of truth in the
# repo. `cargo package` follows it and materializes a real copy in the published
# artifact.
include = ["src/**", "wit/**", "README.md"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# default-features = false drops the host-only half (dlopen/subprocess loaders, OS
# trash, host config paths, the process-global registries, the tokio bridge) and
# leaves the portable data model: FFON with its binary codec, tags, timeline
# records, dashboard types.
# 0.4.0 is a hard floor: it added the `read-asset` host import and the portable
# `assets` URI helpers this crate re-exports. (0.3.0 was the previous floor, for the
# `host` feature itself: against 0.2.x `default-features = false` is a no-op — that
# version has no features at all — so the guest would drag in `trash` and `tokio`,
# neither of which builds for wasm.) 0.8.0 added the `input` text-field model this
# crate re-exports. 0.9.0 is the SDK of WIT 0.2.0 (wasip2 guests, the
# capabilities, tasks and their inbox, rendered pages), which this crate binds.
sicompass-sdk = { version = "0.9.0", path = "..", default-features = false }
wit-bindgen = "0.60.0"

# `fs::list_dir` reads a directory stream itself, which std cannot do past a
# vanished entry (see src/lib.rs). Guest-only, like everything here.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasip2 = "1"
